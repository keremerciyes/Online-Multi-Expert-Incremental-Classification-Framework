[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-anomaly-classification"
version = "0.1.0"
description = "PyTorch Lightning + Hydra project for motor anomaly classification experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "lightning>=2.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "torch>=2.2",
    "wandb>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
