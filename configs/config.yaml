defaults:
  - model: oneclass_multihead
  - backbone: ae_raw_basicmotions
  - head: one_class_cosine_head_conv_projector
  - optimizer: default
  - system: online_oneclass_multihead
  - datamodule: online_oneclass_multihead
  - trainer: default
  - callbacks: default
  - logging: csv
  - paths: default
  - experiment: online_oneclass_multihead
  - _self_

seed: 42

online:
  freeze_backbone: true

oneclass:
  pretrained_backbone_checkpoint_path: null
  # Set to a handcrafted / hybrid bundle (handcrafted16.pt, wdcnn_hybrid.pt) so the
  # datamodule precomputes standardized feature vectors for PrecomputedFeatureBackbone.
  # Leave null for the live AE-encoder backbones (ae_raw_basicmotions, ae_raw_clap).
  feature_bundle_path: null

reconstruction:
  pretrained_encoder_path: null

eval:
  checkpoint_path: null

hydra:
  run:
    dir: ${paths.output_dir}/${experiment.name}
  sweep:
    dir: ${paths.output_dir}/multirun
    subdir: ${hydra.job.num}
